<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Kanji JFT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .kanji-font { font-family: 'Noto Sans JP', sans-serif; }

        /* 3D Flip Styles */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .card-inner { transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1); }
        .card.flipped .card-inner { transform: rotateY(180deg); }

        /* Roda pemilih halaman (scroll picker) */
        .wheel {
            scroll-snap-type: y mandatory;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .wheel::-webkit-scrollbar { display: none; }
        .wheel-item {
            height: 40px;
            scroll-snap-align: center;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Print formatting */
        @media print {
            body { background-color: white; padding: 0; }
            .no-print { display: none !important; }
            .screen-only { display: none !important; }
            .print-only { display: block !important; }
        }
        @media screen {
            .print-only { display: none !important; }
        }
    </style>
</head>

// ================= KONVERSI HIRAGANA -> ROMAJI =================
const romajiMap = {
    'あ':'a','い':'i','う':'u','え':'e','お':'o',
    'か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko',
    'さ':'sa','し':'shi','す':'su','せ':'se','そ':'so',
    'た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to',
    'な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no',
    'は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho',
    'ま':'ma','み':'mi','む':'mu','め':'me','も':'mo',
    'や':'ya','ゆ':'yu','よ':'yo',
    'ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro',
    'わ':'wa','を':'wo','ん':'n',
    'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go',
    'ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo',
    'だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do',
    'ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo',
    'ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po',
    'きゃ':'kya','きゅ':'kyu','きょ':'kyo',
    'しゃ':'sha','しゅ':'shu','しょ':'sho',
    'ちゃ':'cha','ちゅ':'chu','ちょ':'cho',
    'にゃ':'nya','にゅ':'nyu','にょ':'nyo',
    'ひゃ':'hya','ひゅ':'hyu','ひょ':'hyo',
    'みゃ':'mya','みゅ':'myu','みょ':'myo',
    'りゃ':'rya','りゅ':'ryu','りょ':'ryo',
    'ぎゃ':'gya','ぎゅ':'gyu','ぎょ':'gyo',
    'じゃ':'ja','じゅ':'ju','じょ':'jo',
    'びゃ':'bya','びゅ':'byu','びょ':'byo',
    'ぴゃ':'pya','ぴゅ':'pyu','ぴょ':'pyo'
};

function kanaToRomaji(kana) {
    let result = "";
    let i = 0;
    while (i < kana.length) {
        let char = kana[i];
        let nextChar = kana[i+1] || "";
        let combined = char + nextChar;

        if (romajiMap[combined]) {
            result += romajiMap[combined]; i += 2;
        } else if (romajiMap[char]) {
            result += romajiMap[char]; i++;
        } else if (char === 'っ' && nextChar) {
            let nextRomaji = romajiMap[nextChar + (kana[i+2] || "")] || romajiMap[nextChar];
            if (nextRomaji) result += nextRomaji[0];
            i++;
        } else if (char === 'ー' || char === '-') {
            if (result.length > 0) result += result[result.length-1];
            i++;
        } else if (char === '・' || char === ' ') {
            result += ' '; i++;
        } else if (char === '〜' || char === '~') {
            result += '~'; i++;
        } else {
            result += char; i++;
        }
    }
    return result;
}

// ================= HALAMAN UTAMA =================
let currentPage = 1;
const itemsPerPage = 20;
const totalPages = Math.ceil(db.length / itemsPerPage);

document.getElementById('tot-words').textContent = `(${db.length} Kosakata)`;
document.getElementById('tot-page').textContent = totalPages;

function renderCards() {
    const container = document.getElementById('flashcard-grid');
    container.innerHTML = '';

    const start = (currentPage - 1) * itemsPerPage;
    const end = Math.min(start + itemsPerPage, db.length);
    const currentData = db.slice(start, end);

    currentData.forEach(item => {
        const kanji = item[0];
        const furigana = item[1];
        const arti = item[2];
        const romaji = kanaToRomaji(furigana);

        const cardHTML = `
        <div class="card group perspective-1000 cursor-pointer w-full aspect-[5/4] sm:h-36" onclick="this.classList.toggle('flipped')">
            <div class="card-inner relative w-full h-full transform-style-3d">
                <div class="absolute inset-0 backface-hidden bg-white border border-slate-200 rounded-2xl shadow-[0_2px_8px_rgba(0,0,0,0.04)] flex flex-col items-center justify-center p-3">
                    <span class="kanji-font text-3xl sm:text-4xl font-bold text-slate-800">${kanji}</span>
                </div>
                <div class="absolute inset-0 backface-hidden rotate-y-180 bg-[#f0fdf4] border-2 border-[#6ee7b7] rounded-2xl shadow-sm flex flex-col items-center justify-center p-3 text-center">
                    <span class="kanji-font text-lg sm:text-xl font-bold text-slate-900 mb-1 leading-tight">${furigana}</span>
                    <span class="text-sm italic text-teal-600 mb-2">[${romaji}]</span>
                    <span class="text-xs sm:text-sm text-slate-700 font-medium leading-snug px-1">${arti}</span>
                </div>
            </div>
        </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHTML);
    });

    document.getElementById('curr-page').textContent = currentPage;
    document.getElementById('btn-prev').disabled = currentPage === 1;
    document.getElementById('btn-next').disabled = currentPage === totalPages;
}

function changePage(direction) {
    const newPage = currentPage + direction;
    if (newPage >= 1 && newPage <= totalPages) {
        currentPage = newPage;
        renderCards();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

// Fisher-Yates shuffle
function shuffleArray(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
}

function resetCards() {
    const start = (currentPage - 1) * itemsPerPage;
    const end = Math.min(start + itemsPerPage, db.length);

    let pageSlice = db.slice(start, end);
    shuffleArray(pageSlice);

    for (let i = 0; i < pageSlice.length; i++) {
        db[start + i] = pageSlice[i];
    }
    renderCards();
}

// ================= PDF / PRINT =================
function prepareAndPrint() {
    const printContainer = document.getElementById('print-container');
    printContainer.innerHTML = '';

    const headerHTML = `<h2 style="text-align:center; font-size: 22px; font-family: sans-serif; margin-bottom: 24px; color: #0f172a;">Daftar Lengkap Flashcard Kanji JFT (${db.length} Kosakata)</h2>`;

    const grid = document.createElement('div');
    grid.style.display = 'grid';
    grid.style.gridTemplateColumns = 'repeat(4, 1fr)';
    grid.style.gap = '12px';

    db.forEach((item, index) => {
        const kanji = item[0];
        const furigana = item[1];
        const arti = item[2];
        const romaji = kanaToRomaji(furigana);

        const cardHTML = `
            <div style="border: 2px solid #e2e8f0; padding: 12px; text-align: center; border-radius: 12px; page-break-inside: avoid; font-family: sans-serif;">
                <div style="font-size: 11px; color: #94a3b8; text-align: left; margin-bottom: 4px;">#${index + 1}</div>
                <div style="font-size: 28px; font-weight: bold; margin-bottom: 8px; font-family: 'Noto Sans JP', sans-serif; color: #1e293b;">${kanji}</div>
                <div style="font-size: 14px; color: #334155; margin-bottom: 2px;">${furigana}</div>
                <div style="font-size: 12px; color: #0d9488; margin-bottom: 8px; font-style: italic;">[${romaji}]</div>
                <div style="font-size: 13px; font-weight: bold; color: #0f172a;">${arti}</div>
            </div>
        `;
        grid.insertAdjacentHTML('beforeend', cardHTML);
    });

    printContainer.insertAdjacentHTML('afterbegin', headerHTML);
    printContainer.appendChild(grid);

    setTimeout(() => { window.print(); }, 400);
}

function showToast(message) {
    const toast = document.getElementById('toast');
    document.getElementById('toast-message').textContent = message;
    toast.classList.remove('opacity-0');
    setTimeout(() => { toast.classList.add('opacity-0'); }, 3000);
}

        navigator.share({
            title: 'Flashcard Kanji JFT',
            text: `Latihan Flashcard Kanji JFT interaktif (${db.length} Kosakata) dengan fitur Furigana dan Romaji.`,
            url: window.location.href
        }).catch(err => { console.log('Error sharing:', err); });
    } else {
        try {
            const tempInput = document.createElement('input');
            tempInput.value = window.location.href;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            showToast("Link berhasil disalin!");
        } catch (err) {
            showToast("Browser tidak mendukung fitur ini.");
        }
    }
}

// ================= TES HAFALAN =================
const testState = { mode: 'seq', per: 1, list: [], idx: 0 };
const rangeState = { from: 1, to: totalPages };   // default: halaman 1 sampai terakhir
const WHEEL_ITEM_H = 40;                          // tinggi satu angka di roda (px)
const $ = id => document.getElementById(id);

// ---- Roda pemilih halaman ----
function buildWheel(which) {
    const wheel = $('wheel-' + which);
    let html = '<div style="height:60px"></div>';
    for (let n = 1; n <= totalPages; n++) {
        html += `<div class="wheel-item flex items-center justify-center cursor-pointer text-lg text-slate-300 transition-all" data-n="${n}" onclick="setPage('${which}', ${n}, true)">${n}</div>`;
    }
    html += '<div style="height:60px"></div>';
    wheel.innerHTML = html;

    // Saat digeser: ambil angka yang ada di tengah
    wheel.addEventListener('scroll', () => {
        const idx = Math.min(totalPages - 1, Math.max(0, Math.round(wheel.scrollTop / WHEEL_ITEM_H)));
        if (idx + 1 !== rangeState[which]) setPage(which, idx + 1, false);
    }, { passive: true });
}

function refreshWheel(which, doScroll) {
    const wheel = $('wheel-' + which);
    const v = rangeState[which];
    $('test-' + which + '-input').value = v;
    if (doScroll) wheel.scrollTop = (v - 1) * WHEEL_ITEM_H;
    wheel.querySelectorAll('.wheel-item').forEach(el => {
        const active = parseInt(el.dataset.n) === v;
        el.classList.toggle('text-2xl', active);
        el.classList.toggle('font-bold', active);
        el.classList.toggle('text-teal-700', active);
        el.classList.toggle('text-lg', !active);
        el.classList.toggle('text-slate-300', !active);
    });
}

function setPage(which, value, scrollWheel) {
    value = Math.min(totalPages, Math.max(1, value));
    rangeState[which] = value;

    // Pastikan "dari" tidak lebih besar dari "sampai"
    let pushed = null;
    if (which === 'from' && rangeState.from > rangeState.to) { rangeState.to = rangeState.from; pushed = 'to'; }
    if (which === 'to' && rangeState.to < rangeState.from) { rangeState.from = rangeState.to; pushed = 'from'; }

    refreshWheel(which, scrollWheel);
    if (pushed) refreshWheel(pushed, true);
    updateTestInfo();
}

function setupRangeInputs() {
    ['from', 'to'].forEach(which => {
        const input = $('test-' + which + '-input');
        input.maxLength = String(totalPages).length;

        input.addEventListener('focus', () => input.select());
        input.addEventListener('input', () => {
            input.value = input.value.replace(/\D/g, '');
            const n = parseInt(input.value);
            if (!isNaN(n) && n >= 1 && n <= totalPages) setPage(which, n, true);
        });
        input.addEventListener('blur', () => {
            let n = parseInt(input.value);
            if (isNaN(n)) n = rangeState[which];
            setPage(which, n, true);
        });
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter') input.blur();
        });
    });
}

function syncWheels() {
    refreshWheel('from', true);
    refreshWheel('to', true);
}

function setAllPages() {
    rangeState.from = 1;
    rangeState.to = totalPages;
    syncWheels();
    updateTestInfo();
}

// ---- Navigasi halaman tes ----
function openTest() {
    $('main-view').classList.add('hidden');
    $('test-view').classList.remove('hidden');
    showTestSetup();
}

function closeTest() {
    $('test-view').classList.add('hidden');
    $('main-view').classList.remove('hidden');
    window.scrollTo(0, 0);
}

function showTestSetup() {
    $('test-setup').classList.remove('hidden');
    $('test-run').classList.add('hidden');
    $('test-done').classList.add('hidden');
    updateOptStyles();
    syncWheels();
    updateTestInfo();
    window.scrollTo(0, 0);
}

function updateOptStyles() {
    document.querySelectorAll('[data-opt]').forEach(b => {
        const active = String(testState[b.dataset.opt]) === b.dataset.val;
        b.classList.toggle('bg-teal-600', active);
        b.classList.toggle('text-white', active);
        b.classList.toggle('border-teal-600', active);
        b.classList.toggle('bg-slate-50', !active);
        b.classList.toggle('text-slate-600', !active);
        b.classList.toggle('border-slate-200', !active);
    });
}

function selectOpt(kind, val) {
    testState[kind] = kind === 'per' ? parseInt(val) : val;
    updateOptStyles();
}

function getTestRange() {
    const from = rangeState.from;
    const to = rangeState.to;
    const start = (from - 1) * itemsPerPage;
    const end = Math.min(to * itemsPerPage, db.length);
    return { from, to, start, end };
}

function updateTestInfo() {
    const r = getTestRange();
    $('test-info').textContent = `Halaman ${r.from}–${r.to} · ${r.end - r.start} kanji`;
}

function startTest() {
    const r = getTestRange();

    // salin data + simpan nomor halaman asal
    let list = db.slice(r.start, r.end).map((item, i) =>
        [...item, Math.floor((r.start + i) / itemsPerPage) + 1]
    );
    if (testState.mode === 'rand') shuffleArray(list);

    testState.list = list;
    testState.idx = 0;

    $('test-setup').classList.add('hidden');
    $('test-done').classList.add('hidden');
    $('test-run').classList.remove('hidden');
    renderTest();
    window.scrollTo(0, 0);
}

function testCardHTML(item, big) {
    const [kanji, furigana, arti, page] = item;
    const romaji = kanaToRomaji(furigana);
    const size = big ? 'h-64' : 'aspect-[5/4]';
    return `
    <div class="card group perspective-1000 cursor-pointer w-full ${size}" onclick="this.classList.toggle('flipped')">
        <div class="card-inner relative w-full h-full transform-style-3d">
            <div class="absolute inset-0 backface-hidden bg-white border border-slate-200 rounded-2xl shadow-[0_2px_8px_rgba(0,0,0,0.04)] flex items-center justify-center p-3">
                <span class="absolute top-2 left-3 text-[11px] text-slate-300">Hal. ${page}</span>
                <span class="kanji-font ${big ? 'text-6xl' : 'text-3xl'} font-bold text-slate-800">${kanji}</span>
            </div>
            <div class="absolute inset-0 backface-hidden rotate-y-180 bg-[#f0fdf4] border-2 border-[#6ee7b7] rounded-2xl shadow-sm flex flex-col items-center justify-center p-3 text-center">
                <span class="kanji-font ${big ? 'text-3xl' : 'text-lg'} font-bold text-slate-900 mb-1">${furigana}</span>
                <span class="${big ? 'text-lg' : 'text-sm'} italic text-teal-600 mb-2">[${romaji}]</span>
                <span class="${big ? 'text-lg' : 'text-xs'} text-slate-700 font-medium px-1">${arti}</span>
            </div>
        </div>
    </div>`;
}

function renderTest() {
    const { list, idx, per } = testState;
    const slice = list.slice(idx, idx + per);
    const shownEnd = Math.min(idx + per, list.length);

    const grid = $('test-grid');
    grid.className = 'mb-3 grid gap-4 ' + (per === 1 ? 'grid-cols-1' : 'grid-cols-2');
    grid.innerHTML = slice.map(item => testCardHTML(item, per === 1)).join('');

    $('test-progress').textContent = per === 1
        ? `${idx + 1} / ${list.length}`
        : `${idx + 1}–${shownEnd} / ${list.length}`;
    $('test-bar').style.width = (shownEnd / list.length * 100) + '%';
    $('test-prev').disabled = idx === 0;
    $('test-next').textContent = shownEnd >= list.length ? 'Selesai' : 'Berikutnya';
}

function nextTest() {
    const t = testState;
    if (t.idx + t.per >= t.list.length) {
        $('test-run').classList.add('hidden');
        $('test-done').classList.remove('hidden');
        $('test-done-text').textContent = `Kamu sudah melewati ${t.list.length} kanji (${t.mode === 'rand' ? 'acak' : 'berurutan'}).`;
        window.scrollTo(0, 0);
        return;
    }
    t.idx += t.per;
    renderTest();
}

function prevTest() {
    testState.idx = Math.max(0, testState.idx - testState.per);
    renderTest();
}

// Shortcut keyboard: panah kiri / kanan (hanya saat sesi tes berjalan)
document.addEventListener('keydown', e => {
    if ($('test-run').classList.contains('hidden')) return;
    if (e.key === 'ArrowRight') nextTest();
    if (e.key === 'ArrowLeft') prevTest();
});

// ================= INISIALISASI =================
buildWheel('from');
buildWheel('to');
setupRangeInputs();
refreshWheel('from', false);
refreshWheel('to', false);
updateOptStyles();
renderCards();
</script>
